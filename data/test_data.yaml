# ============================================
# 测试数据文件
# 用法: data = load_yaml("test_data.yaml")
#       cases = parametrize_data("test_data.yaml", "login_cases")
# ============================================

# 登录用例数据
login_cases:
  - case_name: "正常登录-有效账号"
    username: "testuser"
    password: "testpass123"
    expected_result: "success"
    severity: "P0"

  - case_name: "登录失败-错误密码"
    username: "testuser"
    password: "wrong_password"
    expected_result: "failure"
    error_message: "用户名或密码错误"
    severity: "P0"

  - case_name: "登录失败-空用户名"
    username: ""
    password: "testpass123"
    expected_result: "failure"
    error_message: "请输入用户名"
    severity: "P1"

  - case_name: "登录失败-空密码"
    username: "testuser"
    password: ""
    expected_result: "failure"
    error_message: "请输入密码"
    severity: "P1"

  - case_name: "登录失败-超长用户名"
    username: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    password: "testpass123"
    expected_result: "failure"
    severity: "P2"

# 搜索用例数据
search_cases:
  - case_name: "正常搜索"
    keyword: "测试"
    expected_count: 1
    severity: "P0"

  - case_name: "搜索特殊字符"
    keyword: "!@#$%"
    expected_count: 0
    severity: "P2"

  - case_name: "空搜索"
    keyword: ""
    expected_count: 0
    severity: "P1"

# 环境相关配置
environments:
  dev:
    base_url: "https://dev.example.com"
    api_timeout: 30
  staging:
    base_url: "https://staging.example.com"
    api_timeout: 30
  production:
    base_url: "https://www.example.com"
    api_timeout: 60
