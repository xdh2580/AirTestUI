[pytest]
# 测试用例搜索路径
testpaths = testcases

# 用例文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认命令行参数
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    -n 0
    --reruns 0

# 自定义标记
markers =
    android: Android 平台测试用例
    ios: iOS 平台测试用例
    common: 公共测试用例
    smoke: 冒烟测试
    regression: 回归测试
    p0: 优先级 P0
    p1: 优先级 P1
    p2: 优先级 P2
    skip_ci: 跳过 CI 环境

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s:%(lineno)d - %(message)s

# 忽略目录
norecursedirs = .git .idea __pycache__ venv resources data

# 最小版本
minversion = 7.0
